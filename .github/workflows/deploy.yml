# slate-alis.co.za is served by Vercel, which runs both the SPA and the Express
# API. The HostAfrica static upload is kept as a manual fallback only: it cannot
# serve /api, so an automatic run would publish a frontend with no backend.
name: Deploy to HostAfrica (manual fallback)

on:
  workflow_dispatch:

concurrency:
  group: hostafrica-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Build frontend
        run: pnpm --filter @workspace/slate-alis run build
        env:
          NODE_ENV: production
          PORT: 5000
          BASE_PATH: /

      # Deploy via the server hostname (not its IP) so the FTPS certificate validates.
      # private_html is a symlink to public_html, so it needs no separate step.
      - name: Deploy to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: da20.host-ww.net
          username: ftp@slate-alis.co.za
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./artifacts/slate-alis/dist/public/
          server-dir: public_html/
          state-name: .ftp-deploy-sync-state-public.json
          dry-run: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            cgi-bin/**
