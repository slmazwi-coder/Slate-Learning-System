openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Learner authentication
  - name: learners
    description: Learner profile and learning intelligence
  - name: assignments
    description: Time-locked assignments and submissions
  - name: teachers
    description: Teacher-created and reviewed class assignments
  - name: remediation
    description: Adaptive learning activities
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: registerLearner
      tags: [auth]
      summary: Register a learner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterLearnerInput"
      responses:
        "201":
          description: Registered learner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "409":
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: loginLearner
      tags: [auth]
      summary: Sign in a learner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginLearnerInput"
      responses:
        "200":
          description: Authenticated learner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logoutLearner
      tags: [auth]
      summary: Sign out the current learner
      responses:
        "204":
          description: Signed out
  /auth/me:
    get:
      operationId: getCurrentLearner
      tags: [auth]
      summary: Get the current learner session
      responses:
        "200":
          description: Current learner or signed-out state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentLearner"
  /learners/me:
    patch:
      operationId: updateLearnerProfile
      tags: [learners]
      summary: Update the current learner profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearnerProfileUpdate"
      responses:
        "200":
          description: Updated learner profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Learner"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/profile:
    patch:
      operationId: updateProfileImage
      tags: [auth]
      summary: Update the signed-in account's profile image (any role)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileImageUpdate"
      responses:
        "200":
          description: Stored profile image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileImageResult"
        "400":
          description: Invalid image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [learners]
      summary: Get the learner dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /assignments:
    get:
      operationId: listAssignments
      tags: [assignments]
      summary: List assignments for the current learner
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assignment"
  /assignments/{assignmentId}:
    get:
      operationId: getAssignment
      tags: [assignments]
      summary: Get one assignment and its current lock state
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      responses:
        "200":
          description: Assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "404":
          description: Assignment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /assignments/{assignmentId}/open:
    post:
      operationId: openAssignment
      tags: [assignments]
      summary: Open an assignment and generate a unique problem set
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      responses:
        "200":
          description: Personalised assignment session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentSession"
        "403":
          description: Assignment is locked or closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /assignments/{assignmentId}/submit:
    post:
      operationId: submitAssignment
      tags: [assignments]
      summary: Submit an assignment before its close time
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentSubmissionInput"
      responses:
        "200":
          description: Marked submission with adaptive recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResult"
        "403":
          description: Submission window is closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /assignments/{assignmentId}/review:
    get:
      operationId: getAssignmentReview
      tags: [assignments]
      summary: Get a released assignment result
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      responses:
        "200":
          description: Released assignment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentReview"
        "403":
          description: Result is not released yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tis/assignments:
    post:
      operationId: createTeacherAssignment
      tags: [teachers]
      summary: Create an unpublished assignment draft for one or more classes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherAssignmentInput"
      responses:
        "201":
          description: Assignment drafts ready for teacher review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherAssignmentDrafts"
        "400":
          description: Invalid assignment settings or source material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tis/assignments/{assignmentId}/publish:
    post:
      operationId: publishTeacherAssignment
      tags: [teachers]
      summary: Save reviewed questions and publish the assignment to learners
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherAssignmentPublishInput"
      responses:
        "200":
          description: Published assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherAssignmentPublishResult"
        "400":
          description: Invalid question set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only the owning teacher can publish
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tis/assignments/{assignmentId}/release-results:
    post:
      operationId: releaseTeacherAssignmentResults
      tags: [teachers]
      summary: Release or hold an assignment's results at any time
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherResultReleaseInput"
      responses:
        "200":
          description: Updated result-release state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherResultReleaseResult"
        "400":
          description: Invalid release action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only the owning teacher can release results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /curriculum/atp:
    get:
      operationId: listAnnualTeachingPlans
      tags: [curriculum]
      summary: List Annual Teaching Plan directives
      description: >-
        Returns the departmental Annual Teaching Plans that override the
        CAPS-derived preset sequence for a subject and grade. A plan is keyed on
        the teaching year it governs (effectiveYear) and the vintage of the
        source document (documentYear), because a teaching year can run on an
        older document.
      parameters:
        - name: year
          in: query
          required: false
          description: Teaching year to filter on. Defaults to the current directive year.
          schema:
            type: string
      responses:
        "200":
          description: Annual Teaching Plan directives
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnualTeachingPlanList"
  /curriculum/directives:
    get:
      operationId: listCurriculumDirectives
      tags: [curriculum]
      summary: List the departmental curriculum directives
      description: >-
        Returns one entry per teaching year recording the circular that governs
        it: whether the department retained the previous Annual Teaching Plans
        or replaced a named set, and whether Slate has loaded the plans the
        directive calls for. Lets a user see which circular the syllabus they
        are following comes from.
      responses:
        "200":
          description: Curriculum directives
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurriculumDirectiveList"
  /curriculum/review:
    get:
      operationId: reviewCurriculum
      tags: [curriculum]
      summary: Review loaded plans against the departmental directives (admin)
      description: >-
        Operator view comparing the directives on record against the plans
        actually loaded, so a departmental update surfaces as a review item (a
        stale plan, or a subject the circular names with nothing loaded) rather
        than as silent drift. Restricted to platform administrators.
      parameters:
        - name: year
          in: query
          required: false
          description: Teaching year to review. Defaults to the latest published directive.
          schema:
            type: string
      responses:
        "200":
          description: Curriculum review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurriculumReviewResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a platform administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /learning-profile:
    get:
      operationId: getLearningProfile
      tags: [learners]
      summary: Get the current learner's adaptive learning profile
      responses:
        "200":
          description: Learning profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningProfile"
  /activity:
    get:
      operationId: getRecentLearningActivity
      tags: [learners]
      summary: Get recent learning activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningActivity"
  /remediation/{activityId}/respond:
    post:
      operationId: respondToRemediation
      tags: [remediation]
      summary: Submit a remediation response and receive a follow-up
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemediationResponseInput"
      responses:
        "200":
          description: Remediation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemediationResult"
components:
  parameters:
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
  schemas:
    AnnualTeachingPlan:
      type: object
      description: >-
        A departmental Annual Teaching Plan directive for one subject and grade.
      properties:
        id:
          type: string
        phase:
          type: string
        subject:
          type: string
        grade: { type: number, minimum: 0, maximum: 13 }
        effectiveYear:
          type: string
          description: Teaching year this plan governs.
        documentYear:
          type: string
          description: Vintage printed on the source document.
        sourceName:
          type: string
        circular:
          type: string
          description: The departmental circular that governs this document.
        topicCount: { type: number, minimum: 0 }
      required:
        - id
        - subject
        - grade
        - effectiveYear
        - documentYear
        - sourceName
        - circular
        - topicCount
    AnnualTeachingPlanList:
      type: object
      properties:
        year:
          type: string
        plans:
          type: array
          items:
            $ref: "#/components/schemas/AnnualTeachingPlan"
      required:
        - year
        - plans
    CurriculumDirective:
      type: object
      properties:
        year:
          type: string
        circular:
          type: string
        sourceUrl:
          type: string
        policy:
          type: string
          enum: [retention, standalone]
        exclusions:
          type: array
          items:
            type: string
        notes:
          type: string
        loaded:
          type: boolean
      required:
        - year
        - circular
        - sourceUrl
        - policy
        - exclusions
        - notes
        - loaded
    CurriculumDirectiveList:
      type: object
      properties:
        directives:
          type: array
          items:
            $ref: "#/components/schemas/CurriculumDirective"
        atpIndexUrl:
          type: string
      required:
        - directives
        - atpIndexUrl
    CurriculumReviewItem:
      type: object
      properties:
        subject:
          type: string
        grade: { type: number, minimum: 0, maximum: 13 }
        phase:
          type: string
        loadedYear:
          type: string
        documentYear:
          type: string
        circular:
          type: string
        status:
          type: string
          enum: [current, stale]
      required:
        - subject
        - grade
        - phase
        - loadedYear
        - documentYear
        - circular
        - status
    CurriculumReview:
      type: object
      properties:
        year:
          type: string
        directive:
          allOf:
            - $ref: "#/components/schemas/CurriculumDirective"
          nullable: true
        current:
          type: array
          items:
            $ref: "#/components/schemas/CurriculumReviewItem"
        stale:
          type: array
          items:
            $ref: "#/components/schemas/CurriculumReviewItem"
        missing:
          type: array
          items:
            type: string
      required:
        - year
        - current
        - stale
        - missing
    CurriculumReviewResponse:
      type: object
      properties:
        review:
          $ref: "#/components/schemas/CurriculumReview"
        directives:
          type: array
          items:
            $ref: "#/components/schemas/CurriculumDirective"
      required:
        - review
        - directives
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Learner:
      type: object
      properties:
        id: { type: string }
        # Permanent, unique SLATE ID ("L000482"). Issued at creation and shown
        # on the profile so a learner can be identified even among namesakes.
        slateId: { type: ["string", "null"] }
        username: { type: string }
        fullName: { type: string }
        grade: { type: number, minimum: 0, maximum: 12 }
        schoolName: { type: string }
        subjects:
          type: array
          items: { type: string }
        # Declared on every new account. Nullable so accounts created before the
        # declaration existed still serialise; the app prompts them after login.
        age: { type: ["number", "null"] }
        gender: { type: ["string", "null"] }
        # Optional details a learner (or the adult creating the account) may add;
        # nullable so accounts that never supplied them still serialise.
        dateOfBirth: { type: ["string", "null"] }
        homeLanguage: { type: ["string", "null"] }
        province: { type: ["string", "null"] }
        profileImage: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, username, fullName, grade, schoolName, subjects, createdAt]
    RegisterLearnerInput:
      type: object
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        password: { type: string, minLength: 8 }
        fullName: { type: string, minLength: 2 }
        grade: { type: number, minimum: 0, maximum: 12 }
        schoolName: { type: string, minLength: 2 }
        # Required in practice, but may be shared by siblings, so it is not the
        # unique identifier — username is. Validated as an email in the route.
        email: { type: string }
        # Compulsory for new learner accounts.
        age: { type: number, minimum: 3, maximum: 100 }
        gender: { type: string, enum: [boy, girl, other] }
        profileImage: { type: ["string", "null"] }
        subjects:
          type: array
          minItems: 1
          items: { type: string }
      required: [username, password, fullName, grade, schoolName, subjects, age, gender]
    LoginLearnerInput:
      type: object
      properties:
        username: { type: string, minLength: 3 }
        password: { type: string, minLength: 1 }
      required: [username, password]
    AuthSession:
      type: object
      properties:
        learner:
          $ref: "#/components/schemas/Learner"
      required: [learner]
    CurrentLearner:
      type: object
      properties:
        learner:
          oneOf:
            - $ref: "#/components/schemas/Learner"
            - type: "null"
      required: [learner]
    LearnerProfileUpdate:
      type: object
      properties:
        fullName: { type: string, minLength: 2 }
        grade: { type: number, minimum: 0, maximum: 12 }
        schoolName: { type: string, minLength: 2 }
        subjects:
          type: array
          minItems: 1
          items: { type: string }
        age: { type: number, minimum: 3, maximum: 100 }
        gender: { type: string, enum: [boy, girl, other] }
        dateOfBirth: { type: ["string", "null"], format: date }
        homeLanguage: { type: ["string", "null"], maxLength: 80 }
        province: { type: ["string", "null"], maxLength: 80 }
        profileImage: { type: ["string", "null"] }
    ProfileImageUpdate:
      type: object
      properties:
        profileImage: { type: ["string", "null"] }
      required: [profileImage]
    ProfileImageResult:
      type: object
      properties:
        profileImage: { type: ["string", "null"] }
      required: [profileImage]
    Assignment:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        subject: { type: string }
        topic: { type: string }
        openAt: { type: string, format: date-time }
        closeAt: { type: string, format: date-time }
        status:
          type: string
          enum: [LOCKED, OPEN, CLOSED, SUBMITTED, MISSED]
        questionCount: { type: number }
        progress: { type: number, minimum: 0, maximum: 100 }
        resultReleasePolicy:
          type: string
          enum: [after_close, immediate]
      required: [id, title, subject, topic, openAt, closeAt, status, questionCount, progress, resultReleasePolicy]
    AssignmentQuestion:
      type: object
      properties:
        id: { type: string }
        prompt: { type: string }
        type:
          type: string
          enum: [text, equation, multiple_choice]
        options:
          type: array
          items: { type: string }
        concept: { type: string }
      required: [id, prompt, type, concept]
    AssignmentSession:
      type: object
      properties:
        assignment:
          $ref: "#/components/schemas/Assignment"
        sessionId: { type: string }
        questions:
          type: array
          items:
            $ref: "#/components/schemas/AssignmentQuestion"
        expiresAt: { type: string, format: date-time }
      required: [assignment, sessionId, questions, expiresAt]
    AnswerInput:
      type: object
      properties:
        questionId: { type: string }
        answer: { type: string }
      required: [questionId, answer]
    AssignmentSubmissionInput:
      type: object
      properties:
        sessionId: { type: string }
        answers:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AnswerInput"
      required: [sessionId, answers]
    QuestionMark:
      type: object
      properties:
        questionId: { type: string }
        verdict:
          type: string
          enum: [CORRECT, INCORRECT, PARTIALLY_CORRECT]
        explanation: { type: string }
        score: { type: number, minimum: 0, maximum: 100 }
        gap:
          type: ["string", "null"]
      required: [questionId, verdict, explanation, score, gap]
    RemediationActivity:
      type: object
      properties:
        id: { type: string }
        format:
          type: string
          enum: [QUIZ, GAME, PUZZLE, CASE_STUDY, ASSESSMENT]
        title: { type: string }
        concept: { type: string }
        prompt: { type: string }
        options:
          type: array
          items: { type: string }
        instruction: { type: string }
      required: [id, format, title, concept, prompt, instruction]
    SubmissionResult:
      type: object
      properties:
        submissionId: { type: string }
        score: { type: ["number", "null"], minimum: 0, maximum: 100 }
        overallVerdict:
          type: ["string", "null"]
          enum: [CORRECT, INCORRECT, PARTIALLY_CORRECT, null]
        feedback: { type: ["string", "null"] }
        marks:
          type: array
          items:
            $ref: "#/components/schemas/QuestionMark"
        markingStatus:
          type: string
          enum: [MARKED, PENDING_TEACHER_REVIEW, MARKING_FAILED]
        released: { type: boolean }
        statusMessage: { type: ["string", "null"] }
        remediation:
          oneOf:
            - $ref: "#/components/schemas/RemediationActivity"
            - type: "null"
      required: [submissionId, score, overallVerdict, feedback, marks, markingStatus, released, remediation]
    AssignmentReview:
      type: object
      properties:
        assignment:
          $ref: "#/components/schemas/Assignment"
        score: { type: number, minimum: 0, maximum: 100 }
        overallVerdict:
          type: string
          enum: [CORRECT, INCORRECT, PARTIALLY_CORRECT]
        feedback: { type: string }
        markingStatus:
          type: string
          enum: [MARKED, PENDING_TEACHER_REVIEW, MARKING_FAILED]
        released: { type: boolean }
        remediation:
          oneOf:
            - $ref: "#/components/schemas/RemediationActivity"
            - type: "null"
        questions:
          type: array
          items:
            type: object
            properties:
              questionId: { type: string }
              prompt: { type: string }
              type: { type: string }
              options: { type: array, items: { type: string } }
              concept: { type: string }
              learnerAnswer: { type: ["string", "null"] }
              verdict: { type: ["string", "null"] }
              score: { type: ["number", "null"] }
              correctAnswer: { type: string }
              explanation: { type: string }
              gap: { type: ["string", "null"] }
            required: [questionId, prompt, type, options, concept, learnerAnswer, verdict, score, correctAnswer, explanation, gap]
      required: [assignment, score, overallVerdict, feedback, markingStatus, released, remediation, questions]
    TeacherQuestionDraft:
      type: object
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        prompt: { type: string, minLength: 1, maxLength: 2000 }
        type:
          type: string
          enum: [text, equation, multiple_choice]
        options:
          type: array
          maxItems: 6
          items: { type: string, minLength: 1, maxLength: 500 }
        concept: { type: string, minLength: 1, maxLength: 200 }
        answer: { type: string, minLength: 1, maxLength: 1000 }
      required: [id, prompt, type, concept, answer]
    TeacherAssignmentInput:
      type: object
      description: Use questions for manual authoring, pdfBase64 for PDF extraction, or omit both for AI drafting.
      properties:
        classIds:
          type: array
          minItems: 1
          maxItems: 30
          items: { type: string }
        title: { type: string, maxLength: 160 }
        topic: { type: string, minLength: 2, maxLength: 160 }
        questionCount: { type: number, minimum: 1, maximum: 10 }
        openAt: { type: string, format: date-time }
        closeAt: { type: string, format: date-time }
        markingMode:
          type: string
          enum: [auto, selective, manual]
        autoMarkQuestions:
          type: array
          items: { type: number, minimum: 0, maximum: 49 }
        questionTypes:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            enum: [multiple_choice, text, equation]
        resultReleasePolicy:
          type: string
          enum: [after_close, immediate]
        questionSource:
          type: string
          enum: [ai, manual, pdf, scan, docx]
        questions:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/TeacherQuestionDraft"
        pdfBase64: { type: string, maxLength: 7000000 }
        fileName: { type: string, maxLength: 200 }
      required: [classIds, topic, questionCount, openAt, closeAt, markingMode, questionTypes, resultReleasePolicy, questionSource]
    TeacherAssignmentDraft:
      type: object
      properties:
        id: { type: string }
        classId: { type: string }
        title: { type: string }
        subject: { type: string }
        topic: { type: string }
        openAt: { type: string, format: date-time }
        closeAt: { type: string, format: date-time }
        questionCount: { type: number }
        markingMode: { type: string, enum: [auto, selective, manual] }
        autoMarkQuestions: { type: array, items: { type: number } }
        questionTypes: { type: array, items: { type: string } }
        resultReleasePolicy: { type: string, enum: [after_close, immediate] }
        questionSource: { type: string, enum: [ai, manual, pdf, scan, docx] }
        aiDraft:
          type: boolean
          description: True when the questions and answer keys were generated by AI and must be confirmed by the teacher before publishing.
        isPublished: { type: boolean }
        questions:
          type: array
          items:
            $ref: "#/components/schemas/TeacherQuestionDraft"
      required: [id, classId, title, subject, topic, openAt, closeAt, questionCount, markingMode, autoMarkQuestions, questionTypes, resultReleasePolicy, questionSource, aiDraft, isPublished, questions]
    TeacherAssignmentDrafts:
      type: object
      properties:
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/TeacherAssignmentDraft"
      required: [assignments]
    TeacherAssignmentPublishInput:
      type: object
      properties:
        questions:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/TeacherQuestionDraft"
        confirmAiDraft:
          type: boolean
          description: Set to true once the teacher has reviewed and confirmed an AI-generated question set and its answer keys.
      required: [questions]
    TeacherAssignmentPublishResult:
      type: object
      properties:
        id: { type: string }
        isPublished: { type: boolean }
        publishedAt: { type: string, format: date-time }
        questionCount: { type: number }
      required: [id, isPublished, publishedAt, questionCount]
    TeacherResultReleaseInput:
      type: object
      properties:
        action:
          type: string
          enum: [release, hold]
      required: [action]
    TeacherResultReleaseResult:
      type: object
      properties:
        assignmentId: { type: string }
        releaseState: { type: string, enum: [RELEASED, HELD] }
        resultsReleasedAt: { type: ["string", "null"], format: date-time }
        resultsHeldAt: { type: ["string", "null"], format: date-time }
        resultsVisibleNow: { type: boolean }
      required: [assignmentId, releaseState, resultsReleasedAt, resultsHeldAt, resultsVisibleNow]
    LearningStyleSignal:
      type: object
      properties:
        format:
          type: string
          enum: [QUIZ, GAME, PUZZLE, CASE_STUDY, ASSESSMENT]
        label: { type: string }
        score: { type: number, minimum: 0, maximum: 100 }
        sessions: { type: number }
      required: [format, label, score, sessions]
    LearningProfile:
      type: object
      properties:
        learnerId: { type: string }
        primaryStyle: { type: string }
        confidence: { type: number, minimum: 0, maximum: 100 }
        signals:
          type: array
          items:
            $ref: "#/components/schemas/LearningStyleSignal"
        activeGaps:
          type: array
          items: { type: string }
      required: [learnerId, primaryStyle, confidence, signals, activeGaps]
    DashboardSummary:
      type: object
      properties:
        learner:
          $ref: "#/components/schemas/Learner"
        assignments:
          type: object
          properties:
            open: { type: number }
            upcoming: { type: number }
            completed: { type: number }
            missed: { type: number }
          required: [open, upcoming, completed, missed]
        streakDays: { type: number }
        averageScore: { type: number }
        nextFocus:
          type: ["string", "null"]
        nextActivity:
          oneOf:
            - $ref: "#/components/schemas/RemediationActivity"
            - type: "null"
        subjects:
          type: array
          items:
            type: object
            properties:
              subject: { type: string }
              classId: { type: string }
              label: { type: string }
              averageScore: { type: ["number", "null"] }
              openAssignments: { type: number }
              missedAssignments: { type: number }
              topGap: { type: ["string", "null"] }
              attention: { type: string }
              lastActive: { type: ["string", "null"] }
            required: [subject, classId, label, averageScore, openAssignments, missedAssignments, topGap, attention, lastActive]
        reminders:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              subject: { type: string }
              classLabel: { type: string }
              closeAt: { type: string, format: date-time }
              hoursLeft: { type: number }
            required: [id, title, subject, classLabel, closeAt, hoursLeft]
        recommended:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/RemediationActivity"
              - type: object
                properties:
                  reason: { type: string }
                required: [reason]
        overall:
          type: object
          properties:
            averageScore: { type: ["number", "null"] }
            weakestSubject:
              type: ["object", "null"]
              properties:
                subject: { type: string }
                averageScore: { type: ["number", "null"] }
            classrooms: { type: number }
            attentionSubjects: { type: number }
          required: [averageScore, weakestSubject, classrooms, attentionSubjects]
      required: [learner, assignments, streakDays, averageScore, nextFocus, nextActivity, subjects, reminders, recommended, overall]
    LearningActivity:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        subject: { type: string }
        score: { type: number }
        timestamp: { type: string, format: date-time }
        detail: { type: string }
      required: [id, label, subject, score, timestamp, detail]
    RemediationResponseInput:
      type: object
      properties:
        answer: { type: string }
        followUp: { type: boolean }
      required: [answer]
    RemediationResult:
      type: object
      properties:
        correct: { type: boolean }
        feedback: { type: string }
        score: { type: number, minimum: 0, maximum: 100 }
        followUpQuestion:
          oneOf:
            - $ref: "#/components/schemas/AssignmentQuestion"
            - type: "null"
        improved: { type: ["boolean", "null"] }
      required: [correct, feedback, score, followUpQuestion, improved]

